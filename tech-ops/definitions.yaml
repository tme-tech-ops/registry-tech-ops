dsl_definitions:

  # For the nodes that only do something when the deployment is installed: they
  # never drift, so an update never re-runs the installer or its checks.
  no_drift: &no_drift
    implementation: tech-ops/scripts/no_drift.py
    executor: central_deployment_agent

  # SSH through the Endpoint proxy to the VM this deployment is deployed on.
  vm_fabric_env: &vm_fabric_env
    host_string: { get_environment_capability: vm_name_id }
    user: { get_environment_capability: vm_user_name }
    key: { get_secret: { get_environment_capability: vm_ssh_private_key } }
    port: 22

  vm_proxy_settings: &vm_proxy_settings
    auto_resolve: false
    enable_socks5: false
    target_id: { get_environment_capability: proxy_target_id }
    target_ip: { get_environment_capability: vm_name_id }

# App deploy. Hidden by offline mode, run_arg arrives as null: offline installs
# run install-harbor too.
  install_task: &install_task
    jmespath: ["[0] || 'install-harbor'", [{ get_input: run_arg }]]

  run_install_cmds: &run_install_cmds
    - concat:
        - "sudo -E ./install_harbor.sh "
        - *install_task

# The fabric plugin passes these as unquoted `export NAME=value`, so every text
# value is wrapped in single quotes here, and the inputs refuse a single quote.
# Numbers and booleans need no quotes.
  shell_env: &shell_env
    DURATION_DAYS: { get_input: duration_days }
    REGISTRY_COMMON_NAME: { concat: ["'", { get_input: common_name }, "'"] }
    COUNTRY: { concat: ["'", { get_input: country }, "'"] }
    STATE: { concat: ["'", { get_input: state }, "'"] }
    LOCATION: { concat: ["'", { get_input: location }, "'"] }
    ORGANIZATION: { concat: ["'", { get_input: organization }, "'"] }
    HARBOR_VERSION: { concat: ["'", { get_input: harbor_version }, "'"] }
    HARBOR_PORT: { get_input: harbor_port }
    HARBOR_USERNAME: { concat: ["'", { get_input: harbor_username }, "'"] }
    HARBOR_PASSWORD: { concat: ["'", { get_input: harbor_password }, "'"] }
    DOCKER_BRIDGE_CIDR: { concat: ["'", { get_input: docker_bridge_cidr }, "'"] }
    # Cleared in the form, projects can arrive as null: send an empty list.
    PROJECTS: { concat: ["'", { jmespath: ["[0] || ''", [{ get_input: projects }]] }, "'"] }
    DEBUG: { get_input: debug }
    # Online, ignore a VERSION.txt that an earlier offline-prep left on the VM.
    HARBOR_FORCE_ONLINE: { jmespath: ["[0] && 'false' || 'true'", [{ get_input: offline_mode }]] }

  command_fabric_env: &command_fabric_env
    shell_env:
      <<: *shell_env
    host_string: { get_environment_capability: vm_name_id }
    user: { get_environment_capability: vm_user_name }
    key: { get_secret: { get_environment_capability: vm_ssh_private_key } }
    port: 22

# Get VM info
  get_vm_info_inputs: &get_vm_info_inputs
    script_path: tech-ops/scripts/get_vm_info.sh
    fabric_env: *vm_fabric_env
    hide_output: { get_input: hide_log_output }
    proxy_settings: *vm_proxy_settings

node_templates:

  vm_info:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        start:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs: *get_vm_info_inputs
        update:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs: *get_vm_info_inputs

  env_precheck:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: tech-ops/scripts/env_precheck.sh
            process:
              env:
                OFFLINE_MODE: { get_input: offline_mode }
                OFFLINE_BINARY_URL: { concat: ["'", { get_input: offline_binary_url }, "'"] }
                OFFLINE_BINARY_USER: { concat: ["'", { get_input: offline_binary_access_user }, "'"] }
                OFFLINE_BINARY_PASSWORD: { concat: ["'", { get_secret: [ { get_input: offline_binary_secret }, binary_image_access_token ] }, "'"] }
                SCRIPT_URL: { concat: ["'", { get_input: script_url }, "'"] }
            fabric_env: *vm_fabric_env
            hide_output: { get_input: hide_log_output }
            proxy_settings: *vm_proxy_settings
        check_drift: *no_drift
    relationships:
       - type: dell.relationships.depends_on
         target: vm_info

  install_app:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          executor: central_deployment_agent
          implementation: fabric.fabric_plugin.tasks.run_commands
          inputs:
            hide_output: { get_input: hide_log_output }
            proxy_settings: *vm_proxy_settings
            commands: *run_install_cmds
            fabric_env:
              <<: *command_fabric_env
        check_drift: *no_drift
        # Uninstalls Harbor only when the deployment is uninstalled and its
        # Install Task installed Harbor. See tech-ops/scripts/harbor_stop.sh.
        stop:
          executor: central_deployment_agent
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: tech-ops/scripts/harbor_stop.sh
            process:
              env:
                RUN_ARG: *install_task
            hide_output: { get_input: hide_log_output }
            proxy_settings: *vm_proxy_settings
            fabric_env: *vm_fabric_env
    relationships:
       - type: dell.relationships.depends_on
         target: env_precheck

  env_postcheck:
    type: dell.nodes.Root
    interfaces:
      dell.interfaces.lifecycle:
        create:
          implementation: fabric.fabric_plugin.tasks.run_script
          inputs:
            script_path: tech-ops/scripts/env_postcheck.sh
            process:
              env:
                RUN_ARG: *install_task
                HARBOR_PORT: { get_input: harbor_port }
                HARBOR_USERNAME: { concat: ["'", { get_input: harbor_username }, "'"] }
                HARBOR_PASSWORD: { concat: ["'", { get_input: harbor_password }, "'"] }
                COMMON_NAME: { concat: ["'", { get_input: common_name }, "'"] }
                UPLOAD_OFFLINE_PACKAGE: { get_input: upload_package }
                UPLOAD_BASE_URL: { concat: ["'", { get_input: upload_binary_url }, "'"] }
                UPLOAD_OFFLINE_PACKAGE_USER: { concat: ["'", { get_input: upload_binary_access_user }, "'"] }
                UPLOAD_OFFLINE_PACKAGE_PASSWORD: { concat: ["'", { get_secret: [ { get_input: upload_binary_secret }, binary_image_access_token ] }, "'"] }
            fabric_env: *vm_fabric_env
            hide_output: { get_input: hide_log_output }
            proxy_settings: *vm_proxy_settings
        check_drift: *no_drift
    relationships:
       - type: dell.relationships.depends_on
         target: install_app
