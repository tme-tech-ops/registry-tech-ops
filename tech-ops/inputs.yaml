inputs:

# Self-Signed Certificate Inputs
  duration_days:
    type: integer
    hidden: false
    required: true
    allow_update: false
    display_label: Duration
    description: |
      Self-Signed Certificate Duration (in days)
    default: 365
    constraints:
      - in_range: [1, 36500]
        error_message: Must be between 1 and 36500 days.
    display:
      group: certificate_config
      index: 1

  common_name:
    type: string
    hidden: false
    required: true
    allow_update: false
    display_label: Common Name
    description: |
      Self-Signed Certificate Common Name
    default: "registry.harbor.edge.lab"
    display:
      group: certificate_config
      index: 5

  country:
    type: string
    hidden: false
    required: true
    allow_update: false
    display_label: Country
    description: |
      Self-Signed Certificate Country
    default: "US"
    display:
      group: certificate_config
      index: 10

  state:
    type: string
    hidden: false
    required: true
    allow_update: false
    display_label: State
    description: |
      Self-Signed Certificate State
    default: "MA"
    display:
      group: certificate_config
      index: 15

  location:
    type: string
    hidden: false
    required: true
    allow_update: false
    display_label: Location
    description: |
      Self-Signed Certificate Location
    default: "Hopkinton"
    display:
      group: certificate_config
      index: 20

  organization:
    type: string
    hidden: false
    required: true
    allow_update: false
    display_label: Organization
    description: |
      Self-Signed Certificate Organization
    default: "EdgeLab"
    display:
      group: certificate_config
      index: 25

# Harbor Inputs
  harbor_version:
    type: string
    hidden: false
    required: true
    allow_update: false
    display_label: Harbor Version
    description: |
      Harbor release version
    default: "2.14.1"
    display:
      group: registry_config
      index: 1

  harbor_port:
    type: integer
    hidden: false
    required: true
    allow_update: false
    display_label: Harbor Port
    description: |
      Harbor Port
    default: 443
    constraints:
      - in_range: [1, 65535]
        error_message: Must be a port number (1-65535).
    display:
      group: registry_config
      index: 5

  harbor_username:
    type: string
    hidden: false
    required: true
    allow_update: false
    display_label: Harbor username
    description: |
      Harbor basic authentication username
    default: "admin"
    display:
      group: registry_config
      index: 10

  harbor_password:
    type: string
    hidden: false
    required: true
    allow_update: false
    display_label: Harbor Password
    description: |
      Harbor basic authentication password
    default: "changeme"
    display:
      group: registry_config
      index: 15

  docker_bridge_cidr:
    type: string
    hidden: false
    required: true
    allow_update: false
    display_label: Docker CIDR
    description: |
      IP CIDR range for Docker (i.e. 172.17.0.1/16)
    default: "172.17.0.1/16"
    display:
      group: registry_config
      index: 20

  projects:
    type: string
    hidden: false
    required: false
    allow_update: false
    display_label: Registry Projects
    description: |
      Auto-created registry projects (Defaults are all supported projects in the tme-tech-ops suite)
    default: "chrislusf e2e-test-images library frrouting haproxytech longhornio metallb rancher velero grafana prom bats kiwigrid prometheus prometheus-operator ingress-nginx kube-state-metrics fluent"
    display:
      group: registry_config
      index: 25

  debug:
    type: integer
    hidden: false
    required: true
    allow_update: false
    display_label: Debug Logging
    description: |
      Set to 0 or 1 to enable or disable debug logging
    default: 1
    constraints:
      - valid_values: [0, 1]
        error_message: Must be 0 or 1.
    display:
      group: registry_config
      index: 30

# Env Config Inputs

  offline_mode:
    type: boolean
    hidden: false
    allow_update: false
    display_label: Airgapped Mode
    description: |
      Set to true to download and install from specified offline package
    default: false
    display:
      group: env_config
      index: 1

  offline_binary_secret:
    type: secret_key
    hidden: false
    only_with: offline_mode
    allow_update: false
    display_label: Offline Binary Configuration Secret
    description: |
      Secret containing url, username, access_token, and 
      version of the offline archive binary.
    constraints:
    - type: binary_configuration
      error_message: Select a secret of type binary_configuration.
    display:
      group: env_config
      index: 5

  run_arg:
    type: string
    hidden: false
    exclusive_with: offline_mode
    allow_update: false
    display_label: Install Task
    description: |
      Install from internet or create offline package
    default: "install-harbor"
    constraints:
      - valid_values:
        - "install-harbor"
        - "offline-prep"
        error_message: Select one of the listed tasks.
    display:
      group: env_config
      index: 10

  script_url:
    type: string
    hidden: false
    exclusive_with: offline_mode
    allow_update: false
    display_label: Script URL
    description: >
      URL of the Harbor installer script (install_harbor.sh). The default is the
      installer commit this release was tested with.
    default: "https://github.com/Chubtoad5/harbor-registry-installer/raw/1bd7b54b24106fd2b39468079e8ab08a7c968858/install_harbor.sh"
    constraints:
      - pattern: '^https?://\S+/install_harbor\.sh$'
        error_message: Enter the URL of install_harbor.sh.
    display:
      group: env_config
      index: 15

  upload_package:
    type: boolean
    hidden: false
    allow_update: false
    display_label: Upload offline-prep package
    description: |
      Only for offline-prep install task, uploads the offline package to http server
    default: false
    display:
      group: env_config
      index: 20

  upload_binary_secret:
    type: secret_key
    hidden: false
    only_with: upload_package
    allow_update: false
    display_label: Upload URL location
    description: |
      Binary configuration secret pointing to the upload location (i.e. https://myfilerserver.lab/upload_dir/).
    constraints:
    - type: binary_configuration
      error_message: Select a secret of type binary_configuration.
    display:
      group: env_config
      index: 25

  hide_log_output:
    type: list
    item_type: string
    hidden: false
    allow_update: false
    display_label: Log Output to hide
    description: |
      stdout hides standard output, stderr hides standard error, both hides both
    default: ["stdout"]
    constraints:
      - valid_values:
        - "both"
        - "stdout"
        - "stderr"
        error_message: Must be both, stdout, or stderr.
    display:
      group: env_config
      index: 30

# Hidden Inputs

  offline_binary_url:
    type: string
    hidden: true
    allow_update: false
    display_label: Offline Binary URL
    description: |
      URL of the OS Image that will be used to create
      the Virtual Machine.
    default:
      get_secret:
      - get_input: offline_binary_secret
      - binary_image_url

  offline_binary_access_user:
    type: string
    allow_update: false
    hidden: true
    display_label: Offline Binary Username
    description: |
      User name of the Repository of the Image Binary that will be
      used to create the Virtual Machine.
    default:
      get_secret:
      - get_input: offline_binary_secret
      - binary_image_access_user

  upload_binary_url:
    type: string
    hidden: true
    allow_update: false
    display_label: Upload Binary URL
    description: |
      URL of the OS Image that will be used to create
      the Virtual Machine.
    default:
      get_secret:
      - get_input: upload_binary_secret
      - binary_image_url

  upload_binary_access_user:
    type: string
    allow_update: false
    hidden: true
    display_label: Upload Binary Username
    description: |
      User name of the Repository of the Image Binary that will be
      used to create the Virtual Machine.
    default:
      get_secret:
      - get_input: upload_binary_secret
      - binary_image_access_user
